name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install + `pnpm check` + `pnpm build`, and the E2E job: `pnpm e2e` builds,
  # creates a fresh local D1, starts the fake SSO + `wrangler dev --local`.
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-build: true
      run-e2e: true
